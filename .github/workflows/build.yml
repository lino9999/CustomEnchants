name: Build CustomEnchants
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - java: '21'
            api: 1.21.11-R0.1-SNAPSHOT
          - java: '25'
            api: 26.3-R0.1-SNAPSHOT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B clean verify -Dbukkit.version=${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        with:
          name: CustomEnchants-java-${{ matrix.java }}
          path: target/CustomEnchants-*.jar
